<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给最爱的你</title>
    <!-- Use Inter font for better display -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 1. 基础样式和背景 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* 柔和的渐变背景 */
            background: linear-gradient(135deg, #ffe4e1 0%, #ffc0cb 100%);
            font-family: 'Inter', sans-serif; /* 使用 Inter 字体 */
            color: #333;
            overflow: hidden; /* 防止滚动条 */
            padding: 20px;
        }

        /* 2. 主要容器样式 */
        .container {
            text-align: center;
            padding: 40px 60px;
            background: rgba(255, 255, 255, 0.85); /* 半透明白色卡片 */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); /* 柔和阴影 */
            backdrop-filter: blur(5px); /* 背景模糊效果 */
            max-width: 90%;
            width: 550px; /* 设定一个最大宽度 */
            transition: all 0.5s ease-in-out;
            transform: scale(1);
        }

        /* 3. 表白文字样式 */
        #main-text {
            font-size: 2.2em; /* 调整字体大小以适应移动端 */
            font-weight: bold;
            color: #d81b60; /* 深粉色 */
            min-height: 100px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            transition: color 1s, font-size 1s;
            white-space: pre-wrap; /* 允许换行 */
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            #main-text {
                font-size: 1.8em;
                min-height: 80px;
            }
        }

        /* 4. 按钮样式 */
        .confession-button {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: 600;
            color: white;
            background: #ff5277; /* 醒目的按钮颜色 */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 5px 15px rgba(255, 82, 119, 0.4);
            transition: all 0.3s ease;
        }

        .confession-button:hover {
            background: #e63960; /* 鼠标悬停变深 */
            transform: translateY(-3px); /* 向上轻微浮动 */
            box-shadow: 0 8px 20px rgba(255, 82, 119, 0.6);
        }

        /* 5. 最终祝福样式 */
        #final-message {
            margin-top: 30px;
            font-size: 1.8em;
            color: #2e7d32; /* 绿色表示成功 */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s, transform 1s;
        }
        
        #final-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 6. 心形动画装饰 (原代码保留) */
        .heart {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ff5277;
            transform: rotate(-45deg);
            animation: heart-fall 10s linear infinite;
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #ff5277;
        }

        .heart::before {
            top: -7.5px;
            left: 0;
        }

        .heart::after {
            left: 7.5px;
            top: 0;
        }

        @keyframes heart-fall {
            0% {
                transform: translateY(-10vh) rotate(-45deg) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(-45deg) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 表白文字显示区域 -->
        <div id="main-text"></div>
        
        <!-- 表白按钮 -->
        <button id="confess-button" class="confession-button">
            点我，告诉我你的答案
        </button>
        
        <!-- 最终祝福信息 -->
        <div id="final-message">
            太棒了！我会永远爱你，直到世界的尽头！
        </div>
    </div>

    <!-- JavaScript 逻辑部分 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mainTextElement = document.getElementById('main-text');
            const confessButton = document.getElementById('confess-button');
            const finalMessage = document.getElementById('final-message');
            
            // 默认的表白文本
            const originalText = "在我心中，你不仅仅是一个人，你是阳光、是星辰、是所有美好的集合。请问，你愿意接受这份独一无二的爱吗？";
            let index = 0;
            let speed = 100; // 初始打字速度 (毫秒)
            let isTyping = true;
            let typeInterval;

            // 1. 打字机效果函数
            function typeWriter() {
                if (index < originalText.length) {
                    // 使用 slice 逐字添加
                    mainTextElement.textContent = originalText.slice(0, index + 1);
                    index++;
                    typeInterval = setTimeout(typeWriter, speed);
                } else {
                    isTyping = false;
                }
            }
            
            // 2. 按钮点击事件处理
            confessButton.addEventListener('click', () => {
                // 如果打字机效果还在进行，则加速完成
                if (isTyping) {
                    clearTimeout(typeInterval);
                    mainTextElement.textContent = originalText; // 立即显示完整文本
                    isTyping = false;
                }
                
                // 隐藏按钮
                confessButton.style.display = 'none';
                
                // 显示最终祝福信息并带有动画效果
                finalMessage.classList.add('show');
            });

            // 3. 背景心形动画生成函数
            function createHeart() {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                // 随机位置
                heart.style.left = Math.random() * 100 + 'vw';
                // 随机动画持续时间
                heart.style.animationDuration = (Math.random() * 5) + 5 + 's';
                // 随机大小
                heart.style.opacity = Math.random(); 
                
                document.body.appendChild(heart);
                
                // 动画结束后移除元素，防止 DOM 爆炸
                setTimeout(() => {
                    heart.remove();
                }, parseFloat(heart.style.animationDuration) * 1000);
            }

            // 启动打字机效果
            typeWriter();
            
            // 每 300 毫秒生成一个心形
            setInterval(createHeart, 300); 
        });
    </script>
</body>
</html>
